# Netlify: build with the Next.js runtime (server pages, API routes, image optimisation, on-demand
# revalidation after admin changes); content edited in /admin lives in Netlify Blobs.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The site moved from b360.ro to b360design.ro (November 2026): every address on the old domain,
# with or without www, goes permanently to the same path on the new one, so links, bookmarks and
# Google's ranking follow it. Answered at Netlify's edge, before the site itself runs.
[[redirects]]
  from = "https://www.b360.ro/*"
  to = "https://www.b360design.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://b360.ro/*"
  to = "https://www.b360design.ro/:splat"
  status = 301
  force = true

# Pictures and 3D models: the browser keeps them a week and, after that, still shows its copy while
# it checks for a newer one, so returning visitors (and the wallpaper rooms, the car models) load at
# once. A file replaced under the same name reaches everyone within a week at most.
[[headers]]
  for = "/tapet/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/calculator/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/lucrari/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/clienti/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
